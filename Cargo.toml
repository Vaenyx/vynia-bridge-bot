[package]
name = "vynia-bridge-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
azalea = {
    git = "https://github.com/azalea-rs/azalea",
  version="0.16.0",  
  default-features = false,
    features = ["log", "online-mode"]
}
dotenvy = "0.15.7"
envy = "0.4.2"
eyre = "0.6.12"
humantime = "2.3.0"
parking_lot = "0.12.5"
poise = "0.6.2"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = "1.0.228"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
